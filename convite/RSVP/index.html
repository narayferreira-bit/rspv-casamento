<script>

const url = "https://script.google.com/macros/s/AKfycbzhM1XPqXIDP24WD5E5VKL6TPhLTsa-UJRW9PTK5PZKtgaQDuUIkq6iqg6Zz72Fxhf-CA/exec";

// TOAST
function toast(msg){
let t=document.getElementById("toast");
t.innerHTML=msg;
t.classList.add("show");

setTimeout(()=>{
t.classList.remove("show");
},2500);
}

// BUSCAR
function buscar(){

let nome=document.getElementById("nome").value.trim();
let btn=document.getElementById("btnBuscar");

if(!nome){
toast("Digite seu nome 🤍");
return;
}

btn.classList.add("loading");
btn.innerText="Buscando...";

fetch(url+"?nome="+encodeURIComponent(nome))
.then(r=>r.json())
.then(d=>{

btn.classList.remove("loading");
btn.innerText="Buscar";

let lista=document.getElementById("lista");
lista.innerHTML="";

if(!d.encontrado){
toast("Nome não encontrado ❌");
return;
}

let div=document.createElement("div");
div.className="nome-item";
div.innerText=d.nome;

div.onclick=function(){
document.getElementById("nome").value=d.nome;
document.getElementById("resultado").innerText=d.nome;
document.getElementById("confirmacao").style.display="block";
lista.innerHTML="";
};

lista.appendChild(div);

})
.catch(()=>{
btn.classList.remove("loading");
btn.innerText="Buscar";
toast("Erro ao buscar ❌");
});

}

// CONFIRMAR
function confirmar(){

let nome=document.getElementById("nome").value.trim();
let status=document.getElementById("resposta").value;
let btn=document.getElementById("btnConfirmar");

if(!nome){
toast("Digite seu nome 🤍");
return;
}

btn.classList.add("loading");
btn.innerText="Confirmando...";

fetch(url,{
method:"POST",
body:JSON.stringify({
nome:nome,
status:status
})
})
.then(r=>r.json())
.then(d=>{

btn.classList.remove("loading");
btn.innerText="Confirmar presença";

if(d.sucesso){

toast("Obrigada pelo carinho 💚<br><small>Nos vemos em breve</small>");

setTimeout(()=>{

document.getElementById("nome").value="";
document.getElementById("resultado").innerText="";
document.getElementById("lista").innerHTML="";
document.getElementById("confirmacao").style.display="none";
document.getElementById("resposta").selectedIndex=0;
document.getElementById("nome").focus();

},1500);

}else{
toast("Erro ao confirmar ❌");
}

})
.catch(()=>{

btn.classList.remove("loading");
btn.innerText="Confirmar presença";

toast("Erro ao confirmar ❌");
});

}

// PIX
function copiarPix(){
navigator.clipboard.writeText("02965634207");
toast("Obrigada pelo carinho 💚");
}

</script>
