<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow-x:hidden;touch-action:manipulation;overscroll-behavior:none;}
body{
font-family:Arial,sans-serif;
background:url('https://i.ibb.co/4gWJnfk9/fundolista.png') no-repeat center center fixed;
background-size:cover;
display:flex;justify-content:center;align-items:center;
min-height:100vh;padding:20px 0;
}
.container{
background:rgba(255,255,255,.95);
padding:20px;border-radius:20px;width:90%;max-width:340px;
text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15);
}
.titulo{width:240px;margin-bottom:20px;pointer-events:none;user-select:none;}
input,select{
width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;
margin-bottom:10px;font-size:16px;outline:none;
}
button{
width:100%;padding:12px;background:#5c6f4f;color:#fff;border:none;
border-radius:12px;font-weight:600;font-family:'Cinzel Decorative',serif;
cursor:pointer;font-size:15px;
}
.loading{opacity:.6;pointer-events:none;}
.lista{margin-top:10px;}
.nome-item{
padding:12px;border-radius:12px;background:#eee;margin-top:8px;
cursor:pointer;font-family:'Cinzel',serif;
}
.resultado{margin-top:10px;font-family:'Cinzel',serif;}
.pix-box{margin-top:35px;padding:18px;background:#f3f3f3;border-radius:15px;}
.pix-title{font-family:'Cinzel Decorative',serif;margin-bottom:15px;font-size:18px;}
.toast{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%) scale(.9);
background:rgba(255,255,255,.97);
padding:20px;border-radius:20px;
opacity:0;transition:.3s;z-index:9999;width:85%;max-width:300px;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
</style>
</head>
<body>

<div class="container">
<img class="titulo" src="https://i.ibb.co/Vc3YTkHy/Design-sem-nome-20260428-232736-0000.png">

<input id="nome" placeholder="Digite seu nome">
<button id="btnBuscar" onclick="buscar()">Buscar</button>

<div id="lista" class="lista"></div>
<div id="resultado" class="resultado"></div>

<div id="confirmacao" style="display:none;">
<p>Você irá comparecer?</p>
<select id="resposta">
<option>Sim, irei</option>
<option>Não poderei ir</option>
</select>
<button id="btnConfirmar" onclick="confirmar()">Confirmar presença</button>
</div>

<div class="pix-box">
<div class="pix-title">💚 Presenteie-nos</div>
<button onclick="copiarPix()">Copiar chave Pix</button>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const url = "https://script.google.com/macros/s/AKfycbzhM1XPqXIDP24WD5E5VKL6TPhLTsa-UJRW9PTK5PZKtgaQDuUIkq6iqg6Zz72Fxhf-CA/exec";

function toast(msg){
 const t=document.getElementById("toast");
 t.innerHTML=msg;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2500);
}

function buscar(){
 let nome=document.getElementById("nome").value.trim();
 let btn=document.getElementById("btnBuscar");

 if(!nome){toast("Digite seu nome 🤍");return;}

 btn.classList.add("loading");
 btn.innerText="Buscando...";

 fetch(url+"?nome="+encodeURIComponent(nome))
 .then(r=>r.json())
 .then(d=>{
   btn.classList.remove("loading");
   btn.innerText="Buscar";

   let lista=document.getElementById("lista");
   lista.innerHTML="";

   if(!d.encontrado){
      toast("Nome não encontrado ❌");
      return;
   }

   let div=document.createElement("div");
   div.className="nome-item";
   div.innerText=d.nome;

   div.onclick=function(){
      document.getElementById("nome").value=d.nome;
      document.getElementById("resultado").innerText=d.nome;
      document.getElementById("confirmacao").style.display="block";
      lista.innerHTML="";
   };

   lista.appendChild(div);
 })
 .catch(()=>{
   btn.classList.remove("loading");
   btn.innerText="Buscar";
   toast("Erro ao buscar ❌");
 });
}

function confirmar(){
 let nome=document.getElementById("nome").value.trim();
 let status=document.getElementById("resposta").value;
 let btn=document.getElementById("btnConfirmar");

 if(!nome){toast("Digite seu nome 🤍");return;}

 btn.classList.add("loading");
 btn.innerText="Confirmando...";

 fetch(url,{
   method:"POST",
   body:JSON.stringify({nome,status})
 })
 .then(r=>r.json())
 .then(d=>{
   btn.classList.remove("loading");
   btn.innerText="Confirmar presença";

   if(d.sucesso){

      toast("Obrigada pelo carinho 💚<br><small>Nos vemos em breve</small>");

      setTimeout(()=>{
         document.getElementById("nome").value="";
         document.getElementById("resultado").innerText="";
         document.getElementById("lista").innerHTML="";
         document.getElementById("confirmacao").style.display="none";
         document.getElementById("resposta").selectedIndex=0;
         document.getElementById("nome").focus();
      },1500);

   }else{
      toast("Erro ao confirmar ❌");
   }
 })
 .catch(()=>{
   btn.classList.remove("loading");
   btn.innerText="Confirmar presença";
   toast("Erro ao confirmar ❌");
 });
}

function copiarPix(){
 navigator.clipboard.writeText("02965634207");
 toast("Obrigada pelo carinho 💚");
}
</script>

</body>
</html>
