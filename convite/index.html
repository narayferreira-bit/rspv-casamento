<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Joaz & Thaay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

html,body{
  background:black;
  overflow-x:hidden;
  font-family: serif;
}

/* CONTAINER */
.container{
  position:relative;
  max-width:500px;
  margin:auto;
}

#toqueAbrir{
  position:absolute;
  bottom:18%;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:#f5e3b3;
  font-family:'Cinzel Decorative', serif;
  font-size:20px;
  white-space:nowrap;
  text-shadow:0 0 12px rgba(255,215,120,.9);
}

/* VÍDEO */
video{
  width:100%;
  display:block;
  object-fit:cover;
  cursor:pointer;
}

/* CONVITE */
#convite{
  display:none;
  position:relative;
}

#convite img{
  width:100%;
  display:block;
}

/* ÁREAS DE CLIQUE */
.click{
  position:absolute;
  bottom:7.5%;
  width:16%;
  height:12%;
  cursor:pointer;
}

/* POSIÇÃO DOS BOTÕES */
.dress{
  left:3%;
}

.local{
  left:22%;
}

.confirmar{
  left:41%;
}

.presente{
  left:60%;
}

.manual{
  left:80%;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:999;
  padding:20px;
}

.modal img{
  width:100%;
  max-width:500px;
  border-radius:12px;
}

.close{
  position:absolute;
  top:20px;
  right:25px;
  color:white;
  font-size:35px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- VÍDEO -->
<div class="container">

<div id="toqueAbrir">✨ Toque para abrir ✨</div>
<video id="video" playsinline preload="metadata">
<source src="video.mp4" type="video/mp4">
</video>

</div>

<!-- MÚSICA -->
<audio id="musica" loop>
<source src="musica.mp3" type="audio/mp3">
</audio>

<!-- CONVITE -->
<div id="convite" class="container">

<img src="convite.png">

<div class="click dress"
onclick="abrirModal('dresscode.png')">
</div>

<div class="click local"
onclick="abrirLocal()">
</div>

<div class="click confirmar"
onclick="abrirConfirmacao()">
</div>

<div class="click presente"
onclick="abrirModal('presentes.png')">
</div>

<div class="click manual"
onclick="abrirModal('manual.png')">
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">

<span class="close"
onclick="fecharModal()">×</span>

<img id="imgModal">

</div>

<script>

const video = document.getElementById("video");
const musica = document.getElementById("musica");
const convite = document.getElementById("convite");
const modal = document.getElementById("modal");
const imgModal = document.getElementById("imgModal");

/* TOQUE PARA ABRIR */
video.addEventListener("click", async () => {
  const aviso=document.getElementById("toqueAbrir");
  if(aviso) aviso.style.display="none";

  try {

    await video.play();
    await musica.play();

  } catch(error) {

    console.log(error);

  }

});

/* TERMINOU O VÍDEO */
video.onended = () => {

  video.style.display = "none";
  convite.style.display = "block";

};

/* ABRIR MODAL */
function abrirModal(imagem){

  modal.style.display = "flex";
  imgModal.src = imagem;

}

/* FECHAR MODAL */
function fecharModal(){

  modal.style.display = "none";

}

/* LOCALIZAÇÃO */
function abrirLocal(){

window.open(
"https://share.google/unqtJ1mP9uSPobIu9",
"_blank"
);

}

/* RSVP */
function abrirConfirmacao(){

window.open(
"https://rspv-casamento-three.vercel.app/RSVP/index.html",
"_blank"
);

}

/* PIX PRESENTES */
imgModal.addEventListener("click", () => {

if(imgModal.src.includes("presentes.png")){

navigator.clipboard.writeText("02965634207");

/* remove aviso antigo se existir */
const avisoAntigo = document.getElementById("avisoPix");
if(avisoAntigo){
  avisoAntigo.remove();
}

/* cria caixa branca elegante */
const aviso = document.createElement("div");
aviso.id = "avisoPix";

aviso.innerHTML = `
<div style="
position:fixed;
top:50%;
left:50%;
transform:translate(-50%, -50%);
background:#fff;
padding:28px;
border-radius:28px;
width:85%;
max-width:420px;
box-shadow:0 10px 35px rgba(0,0,0,0.18);
z-index:99999;
text-align:center;
font-family:'Cinzel', serif;
animation:fadeIn .3s ease;
">

<p style="
font-size:16px;
color:#4f5d41;
line-height:1.8;
margin:0;
font-family:'Cinzel', serif;
">
💚 O maior presente é sua presença,<br>
mas sua contribuição com nosso novo começo será recebida com muito amor ✨
</p>

<button onclick="document.getElementById('avisoPix').remove()"
style="
margin-top:20px;
background:#6b7d57;
color:white;
border:none;
padding:14px 30px;
border-radius:14px;
font-size:16px;
cursor:pointer;
font-family:'Cinzel', serif;
">
OK
</button>

</div>
`;

document.body.appendChild(aviso);

setTimeout(() => {
const caixa = document.getElementById("avisoPix");
if(caixa){
caixa.remove();
}
}, 5000);

}

});
</script>

</body>
</html>
