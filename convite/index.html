<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Joaz & Thaay</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

html,body{
  background:black;
  overflow-x:hidden;
  font-family: serif;
}

/* CONTAINER */
.container{
  position:relative;
  max-width:500px;
  margin:auto;
  background:black;
}

/* VÍDEO */
video{
  width:100%;
  display:block;
  object-fit:cover;
  cursor:pointer;
}

/* CONVITE */
#convite{
  display:none;
  position:relative;
}

#convite img{
  width:100%;
  display:block;
}

/* ÁREAS DE CLIQUE */
.click{
  position:absolute;
  bottom:3.5%;
  width:12%;
  height:6%;
  cursor:pointer;
}

/* POSIÇÕES DOS BOTÕES */
.dress{
 left:7%;
}

.local{
 left:26%;
}

.confirmar{
 left:44%;
}

.presente{
 left:62%;
}

.manual{
 left:80%;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:999;
  padding:20px;
}

.modal img{
  width:100%;
  max-width:500px;
  border-radius:12px;
}

.close{
  position:absolute;
  top:20px;
  right:25px;
  color:white;
  font-size:35px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- VÍDEO -->
<div class="container">
  <video id="video" poster="capa.jpg" playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<!-- MÚSICA -->
<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mp3">
</audio>

<!-- CONVITE -->
<div id="convite" class="container">

<img src="convite.png">

<div class="click dress"
onclick="abrirModal('dresscode.png')">
</div>

<div class="click local"
onclick="abrirLocal()">
</div>

<div class="click confirmar"
onclick="abrirConfirmacao()">
</div>

<div class="click presente"
onclick="abrirModal('presentes.png')">
</div>

<div class="click manual"
onclick="abrirModal('manual.png')">
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">

<span class="close"
onclick="fecharModal()">×</span>

<img id="imgModal">

</div>

<script>

const video = document.getElementById("video");
const musica = document.getElementById("musica");
const convite = document.getElementById("convite");
const modal = document.getElementById("modal");
const imgModal = document.getElementById("imgModal");

/* TOQUE PARA ABRIR */
video.addEventListener("click", async () => {

 try{
   await video.play();
   await musica.play();
 }catch(error){
   console.log(error);
 }

});

/* TERMINOU O VÍDEO */
video.onended = () => {

 video.style.display = "none";
 convite.style.display = "block";

};

/* ABRIR MODAL */
function abrirModal(imagem){

 modal.style.display = "flex";
 imgModal.src = imagem;

}

/* FECHAR MODAL */
function fecharModal(){

 modal.style.display = "none";

}

/* LOCALIZAÇÃO */
function abrirLocal(){

 window.open(
 "https://share.google/unqtJ1mP9uSPobIu9",
 "_blank"
 );

}

/* CONFIRMAR PRESENÇA */
function abrirConfirmacao(){

 window.open(
 "https://rspv-casamento-three.vercel.app/",
 "_blank"
 );

}

/* PIX */
imgModal.addEventListener("click", () => {

 if(imgModal.src.includes("presentes.png")){

   navigator.clipboard.writeText("02965634207");

   alert("💚 Obrigada pelo carinho!\nSua contribuição significa muito para nós. Que Deus abençoe você ✨");
}

});


</script>

</body>
</html>
